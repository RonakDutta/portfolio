    <!-- The curtain. Painted by the parser, not by React, so there is never a
         white flash in front of the thing that exists to remove it. -->
    <style>
      html {
        background: #010101;
      }
      #curtain {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: hidden;
        background: #010101;
      }
      .cu-half {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50.5%;
        background: #010101;
        will-change: transform;
      }
      .cu-left {
        left: 0;
      }
      .cu-right {
        right: 0;
      }
      #cu-seam {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 1px;
        margin-left: -0.5px;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(140, 101, 8, 0.6) 40%,
          rgba(255, 245, 199, 0.95) 50%,
          rgba(140, 101, 8, 0.6) 60%,
          transparent
        );
        opacity: 0;
      }
      .cu-core {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.75rem;
      }
      .cu-name {
        margin: 0;
        font-family: "Cormorant Garamond", ui-serif, Georgia, serif;
        font-weight: 300;
        font-size: clamp(1.5rem, 5vw, 2.25rem);
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        text-transform: uppercase;
        color: #fff9ec;
      }
      .cu-bar {
        position: relative;
        width: min(160px, 38vw);
        height: 1px;
        background: rgba(255, 249, 236, 0.09);
        overflow: hidden;
      }
      #cu-fill {
        display: block;
        height: 100%;
        width: 100%;
        transform: scaleX(0);
        transform-origin: 0 50%;
        background: linear-gradient(90deg, #6f4700, #d4af37 55%, #fff5c7);
        animation: cu-creep 2.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes cu-creep {
        to {
          transform: scaleX(0.4);
        }
      }
      .cu-word {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 0.6rem;
        font-weight: 500;
        letter-spacing: 0.3em;
        text-indent: 0.3em;
        text-transform: uppercase;
        color: #6e6659;
      }
      @media (prefers-reduced-motion: reduce) {
        #cu-fill {
          animation: none;
          transform: scaleX(0.4);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="curtain" aria-hidden="true">
      <div class="cu-half cu-left"></div>
      <div class="cu-half cu-right"></div>
      <div id="cu-seam"></div>
      <div class="cu-core">
        <p class="cu-name">Ronak Dutta</p>
        <div class="cu-bar"><i id="cu-fill"></i></div>
        <p class="cu-word">Software Engineer</p>
      </div>
    </div>
