    <!-- The overture: an eclipse forms while the page loads, then flies onto
         the hero and hands over to the live corona. Painted by the parser
         rather than by React, so nothing flashes in front of it. Curtain.jsx
         drives it and removes it. -->
    <style>
      html {
        background: #07060a;
      }
      @property --p {
        syntax: "<number>";
        inherits: true;
        initial-value: 0;
      }
      #curtain {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: hidden;
        background-color: #07060a;
        color: #cdc4b4;
        font-family: "Martian Mono", ui-monospace, Menlo, monospace;
        font-size: 0.66rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #cu-stage {
        --d: min(36vmin, 22rem);
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--d);
        height: var(--d);
        margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
        animation: cu-creep 2.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        will-change: transform;
      }
      @keyframes cu-creep {
        from {
          --p: 0;
        }
        to {
          --p: 0.55;
        }
      }
      #cu-stage i {
        position: absolute;
        inset: 0;
        border-radius: 50%;
      }
      #cu-halo {
        inset: -95% !important;
        background: radial-gradient(
          closest-side,
          rgba(255, 246, 222, 0.9) 33%,
          rgba(236, 215, 163, 0.45) 35.5%,
          rgba(200, 164, 92, 0.18) 46%,
          rgba(138, 109, 51, 0.07) 64%,
          transparent 100%
        );
        opacity: calc(var(--p) * var(--p) * 0.95);
      }
      #cu-sun {
        background: radial-gradient(
          circle,
          #fffaf0 0%,
          #fff0c8 50%,
          #f1d18a 80%,
          #d29f52 100%
        );
        box-shadow:
          0 0 30px 4px rgba(255, 236, 190, calc(0.55 - var(--p) * 0.5)),
          0 0 140px 40px rgba(200, 164, 92, calc(0.3 - var(--p) * 0.25));
      }
      #cu-moon {
        background: #07060a;
        transform: translateX(calc((1 - var(--p)) * -118%)) scale(1.015);
      }
      #cu-diamond {
        inset: 50% auto auto 99.5% !important;
        width: 0;
        height: 0;
        opacity: 0;
      }
      #cu-diamond::before,
      #cu-diamond::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }
      #cu-diamond::before {
        width: calc(var(--d) * 0.7);
        height: calc(var(--d) * 0.7);
        background: radial-gradient(
          closest-side,
          #fff 0%,
          rgba(255, 246, 222, 0.8) 12%,
          rgba(236, 215, 163, 0.25) 40%,
          transparent 100%
        );
      }
      #cu-diamond::after {
        width: calc(var(--d) * 2.6);
        height: 3px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 246, 222, 0.85) 50%,
          transparent
        );
        border-radius: 0;
      }
      .cu-row {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 1rem;
        padding: 0 1.25rem;
      }
      .cu-row p {
        margin: 0;
        line-height: 1.6;
      }
      .cu-row.top {
        top: 1.4rem;
      }
      .cu-row.bottom {
        bottom: 1.4rem;
      }
      @media (min-width: 640px) {
        .cu-row {
          padding: 0 2.25rem;
        }
        .cu-row.top {
          top: 1.9rem;
        }
        .cu-row.bottom {
          bottom: 1.9rem;
        }
      }
      #cu-count {
        font-family: "Mona Sans", ui-sans-serif, system-ui, sans-serif;
        font-stretch: 125%;
        font-weight: 800;
        font-size: clamp(2.4rem, 9vw, 6rem);
        line-height: 0.8;
        letter-spacing: -0.04em;
        color: #f6f1e7;
        font-variant-numeric: tabular-nums;
      }
      .cu-gold {
        color: #c8a45c;
      }
      @media (prefers-reduced-motion: reduce) {
        #cu-stage {
          animation: none;
          --p: 1;
        }
      }
    </style>
  </head>
