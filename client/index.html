    <!-- ── Threshold ──────────────────────────────────────────────────────
         The gate that covers the page while three.js and the fonts arrive.

         It lives here rather than in a React component so that it is painted
         by the HTML parser, before a single byte of JavaScript has run. That
         is the whole point: mounting it from React would put the black flash
         it exists to remove *in front of it*.

         React does not re-render this markup. `Threshold.jsx` adopts these
         nodes and drives them with GSAP, then removes them. The CSS below is
         only what has to be right before the stylesheet loads: the stone, the
         rim drawing itself, and the bar creeping while the bundle downloads. -->
    <style>
      html {
        background: #05030a;
      }
      #threshold {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: hidden;
        font-family: Cinzel, Georgia, serif;
      }
      .th-half {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50.5%;
        background:
          linear-gradient(
            to bottom,
            rgba(255, 235, 205, 0.05) 0 1px,
            transparent 1px
          ),
          repeating-linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.5) 0 1px,
            transparent 1px 84px
          ),
          radial-gradient(
            120% 90% at 50% 120%,
            rgba(255, 77, 0, 0.16) 0%,
            transparent 62%
          ),
          linear-gradient(to bottom, #191320 0%, #0d0913 60%, #170e14 100%);
        will-change: transform;
      }
      .th-left {
        left: 0;
        box-shadow: inset -1px 0 0 rgba(255, 122, 24, 0.28);
      }
      .th-right {
        right: 0;
        box-shadow: inset 1px 0 0 rgba(255, 122, 24, 0.28);
      }
      /* Heat trapped in the seam between the leaves. */
      #th-seam {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 2px;
        margin-left: -1px;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(255, 138, 31, 0.55) 30%,
          rgba(255, 240, 214, 0.8) 50%,
          rgba(255, 138, 31, 0.55) 70%,
          transparent
        );
        opacity: 0.5;
      }
      .th-core {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
      }
      .th-sigil {
        width: 84px;
        height: 84px;
        filter: drop-shadow(0 0 22px rgba(255, 77, 0, 0.45));
      }
      /* 167 is the perimeter of the diamond, so the rim draws itself in one
         continuous stroke from the top vertex. */
      .th-sigil .sigil-rim {
        stroke-dasharray: 167;
        stroke-dashoffset: 167;
        animation: th-strike 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
      }
      .th-sigil .sigil-letter,
      .th-sigil .sigil-rule,
      .th-sigil .sigil-facet {
        opacity: 0;
        animation: th-emerge 0.7s ease-out 0.85s forwards;
      }
      @keyframes th-strike {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes th-emerge {
        to {
          opacity: 1;
        }
      }
      .th-bar {
        position: relative;
        width: min(200px, 44vw);
        height: 2px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      #th-fill {
        display: block;
        height: 100%;
        width: 100%;
        transform: scaleX(0);
        transform-origin: 0 50%;
        background: linear-gradient(90deg, #8c2606, #ff4d00 55%, #ffc061);
        box-shadow: 0 0 12px rgba(255, 77, 0, 0.8);
        animation: th-creep 2.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      /* Movement while the bundle is still in flight. GSAP takes over from
         whatever value this has reached, so the bar never jumps backwards. */
      @keyframes th-creep {
        to {
          transform: scaleX(0.4);
        }
      }
      .th-word {
        margin: 0;
        font-size: 0.6rem;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        text-transform: uppercase;
        color: #9d8f7d;
      }
      @media (prefers-reduced-motion: reduce) {
        .th-sigil .sigil-rim,
        .th-sigil .sigil-letter,
        .th-sigil .sigil-rule,
        .th-sigil .sigil-facet,
        #th-fill {
          animation: none;
          stroke-dashoffset: 0;
          opacity: 1;
        }
        #th-fill {
          transform: scaleX(0.4);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- aria-hidden: this is scenery. The page underneath is already in the
         accessibility tree and reachable, so a screen reader is never held at
         a door it cannot see. -->
    <div id="threshold" aria-hidden="true">
      <div class="th-half th-left"></div>
      <div class="th-half th-right"></div>
      <div id="th-seam"></div>
      <div class="th-core">
        <!-- Injected from public/favicon.svg at build time by the
             inline-sigil plugin, so the mark has one source of truth. -->
        <!--SIGIL-->
        <div class="th-bar"><i id="th-fill"></i></div>
        <p class="th-word">Abandon all hope</p>
      </div>
    </div>

    <noscript>
      <!-- Nothing is coming to open the gate, so take it down. -->
      <style>
        #threshold {
          display: none;
        }
      </style>
