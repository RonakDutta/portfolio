    <!-- The overture. Painted by the parser rather than by React, so there is
         never a white flash in front of the thing that exists to prevent one.
         Everything below is inert markup: Curtain.jsx animates and removes it. -->
    <style>
      html {
        background: #07060a;
      }
      #curtain {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: hidden;
        background: #07060a;
        will-change: clip-path;
      }
      #cu-wash {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            80% 60% at 50% 108%,
            rgba(200, 164, 92, 0.16) 0%,
            transparent 70%
          ),
          radial-gradient(
            60% 50% at 18% -10%,
            rgba(200, 164, 92, 0.07) 0%,
            transparent 70%
          );
      }
      .cu-core {
        position: absolute;
        inset: auto 0 0 0;
        padding: 0 1.5rem 1.75rem;
        will-change: transform;
      }
      @media (min-width: 640px) {
        .cu-core {
          padding: 0 2.5rem 2.25rem;
        }
      }
      .cu-rule {
        position: relative;
        height: 1px;
        width: 100%;
        margin-bottom: 1.5rem;
        background: rgba(200, 164, 92, 0.16);
        overflow: hidden;
      }
      #cu-fill {
        display: block;
        height: 100%;
        width: 100%;
        transform: scaleX(0);
        transform-origin: 0 50%;
        background: linear-gradient(90deg, #8a6d33, #c8a45c 60%, #f0e0b8);
        animation: cu-creep 2.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes cu-creep {
        to {
          transform: scaleX(0.42);
        }
      }
      .cu-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1.5rem;
      }
      .cu-name {
        margin: 0;
        font-family: "Ephesis", "Snell Roundhand", cursive;
        word-spacing: 0.14em;
        font-size: clamp(2.6rem, 11vw, 5.5rem);
        font-weight: 400;
        line-height: 0.95;
        color: #f7f4ee;
        opacity: 0;
        transform: translateY(0.25em);
        transition:
          opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
          transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .cu-core.is-ready .cu-name {
        opacity: 1;
        transform: none;
      }
      .cu-word {
        margin: 0.35rem 0 0;
        font-family:
          "Instrument Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-size: 0.6rem;
        font-weight: 500;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        text-transform: uppercase;
        color: rgba(200, 164, 92, 0.85);
      }
      #cu-count {
        flex-shrink: 0;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: clamp(1.6rem, 5vw, 2.4rem);
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.02em;
        color: rgba(200, 164, 92, 0.55);
        font-variant-numeric: tabular-nums;
      }
      @media (prefers-reduced-motion: reduce) {
        #cu-fill {
          animation: none;
          transform: scaleX(0.42);
        }
        .cu-name {
          opacity: 1;
          transform: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="curtain" aria-hidden="true">
      <div id="cu-wash"></div>
      <div class="cu-core">
        <div class="cu-rule"><i id="cu-fill"></i></div>
        <div class="cu-row">
          <div>
            <p class="cu-name">Ronak Dutta</p>
            <p class="cu-word">Software Engineer — New Delhi</p>
          </div>
          <p id="cu-count">00</p>
        </div>
      </div>
    </div>
