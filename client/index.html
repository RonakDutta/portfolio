    <!-- The curtain. Painted by the parser, not by React, so there is never a
         white flash in front of the thing that exists to remove it. -->
    <style>
      html {
        background: #030304;
      }
      #curtain {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: hidden;
        background: #030304;
      }
      .cu-half {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50.5%;
        background: #030304;
        will-change: transform;
      }
      .cu-left {
        left: 0;
      }
      .cu-right {
        right: 0;
      }
      #cu-seam {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 1px;
        margin-left: -0.5px;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(212, 175, 55, 0.7) 40%,
          rgba(255, 248, 220, 0.98) 50%,
          rgba(212, 175, 55, 0.7) 60%,
          transparent
        );
        opacity: 0;
      }
      .cu-core {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
      }
      .cu-name {
        margin: 0;
        font-family: "Cinzel", "Playfair Display", Georgia, serif;
        font-weight: 600;
        font-size: clamp(1.4rem, 4.5vw, 2.2rem);
        letter-spacing: 0.38em;
        text-indent: 0.38em;
        text-transform: uppercase;
        color: #fff8dc;
        text-shadow: 0 0 24px rgba(212, 175, 55, 0.35);
      }
      .cu-bar {
        position: relative;
        width: min(180px, 42vw);
        height: 1.5px;
        background: rgba(255, 248, 220, 0.12);
        overflow: hidden;
        box-shadow: 0 0 12px rgba(212, 175, 55, 0.2);
      }
      #cu-fill {
        display: block;
        height: 100%;
        width: 100%;
        transform: scaleX(0);
        transform-origin: 0 50%;
        background: linear-gradient(90deg, #b38628, #d4af37 50%, #fff8dc);
        animation: cu-creep 2.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes cu-creep {
        to {
          transform: scaleX(0.4);
        }
      }
      .cu-word {
        margin: 0;
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.36em;
        text-indent: 0.36em;
        text-transform: uppercase;
        color: #d4af37;
        opacity: 0.85;
      }
      @media (prefers-reduced-motion: reduce) {
        #cu-fill {
          animation: none;
          transform: scaleX(0.4);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="curtain" aria-hidden="true">
      <div class="cu-half cu-left"></div>
      <div class="cu-half cu-right"></div>
      <div id="cu-seam"></div>
      <div class="cu-core">
        <p class="cu-name">Ronak Dutta</p>
        <div class="cu-bar"><i id="cu-fill"></i></div>
        <p class="cu-word">Software Engineer</p>
      </div>
    </div>
