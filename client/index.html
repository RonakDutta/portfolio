<style>
      html {
        background: #05030a;
      }
      #threshold {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: hidden;
        font-family: Cinzel, Georgia, serif;
      }
      .th-half {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50.5%;
        background:
          linear-gradient(
            to bottom,
            rgba(255, 235, 205, 0.05) 0 1px,
            transparent 1px
          ),
          repeating-linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.5) 0 1px,
            transparent 1px 84px
          ),
          radial-gradient(
            120% 90% at 50% 120%,
            rgba(185, 138, 82, 0.10) 0%,
            transparent 62%
          ),
          linear-gradient(to bottom, #191320 0%, #0d0913 60%, #170e14 100%);
        will-change: transform;
      }
      .th-left {
        left: 0;
        box-shadow: inset -1px 0 0 rgba(185, 138, 82, 0.24);
      }
      .th-right {
        right: 0;
        box-shadow: inset 1px 0 0 rgba(185, 138, 82, 0.24);
      }
      
      #th-seam {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 2px;
        margin-left: -1px;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(185, 138, 82, 0.5) 30%,
          rgba(233, 205, 168, 0.75) 50%,
          rgba(185, 138, 82, 0.5) 70%,
          transparent
        );
        opacity: 0.5;
      }
      .th-core {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
      }
      .th-sigil {
        width: 84px;
        height: 84px;
        filter: drop-shadow(0 0 18px rgba(185, 138, 82, 0.38));
      }
      
      .th-sigil .sigil-rim {
        stroke-dasharray: 167;
        stroke-dashoffset: 167;
        animation: th-strike 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
      }
      .th-sigil .sigil-letter,
      .th-sigil .sigil-rule,
      .th-sigil .sigil-facet {
        opacity: 0;
        animation: th-emerge 0.7s ease-out 0.85s forwards;
      }
      @keyframes th-strike {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes th-emerge {
        to {
          opacity: 1;
        }
      }
      .th-bar {
        position: relative;
        width: min(200px, 44vw);
        height: 2px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      #th-fill {
        display: block;
        height: 100%;
        width: 100%;
        transform: scaleX(0);
        transform-origin: 0 50%;
        background: linear-gradient(90deg, #4a3720, #b98a52 55%, #dcae74);
        box-shadow: 0 0 10px rgba(185, 138, 82, 0.55);
        animation: th-creep 2.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      @keyframes th-creep {
        to {
          transform: scaleX(0.4);
        }
      }
      .th-word {
        margin: 0;
        font-size: 0.6rem;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        text-transform: uppercase;
        color: #8a8290;
      }
      @media (prefers-reduced-motion: reduce) {
        .th-sigil .sigil-rim,
        .th-sigil .sigil-letter,
        .th-sigil .sigil-rule,
        .th-sigil .sigil-facet,
        #th-fill {
          animation: none;
          stroke-dashoffset: 0;
          opacity: 1;
        }
        #th-fill {
          transform: scaleX(0.4);
        }
      }
    </style>
  </head>

<div id="threshold" aria-hidden="true">

        <!--SIGIL-->
        <div class="th-bar"><i id="th-fill"></i></div>
