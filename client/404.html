<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020202" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Ronak Dutta</title>

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300..600&family=Inter:wght@300..600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        background: #020202;
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
        color: #e8e3d8;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-weight: 300;
        font-size: clamp(1.05rem, 0.98rem + 0.35vw, 1.2rem);
        line-height: 1.7;
        text-align: center;
        overflow-x: clip;
        -webkit-font-smoothing: antialiased;
      }

      .ground {
        position: fixed;
        inset: 0;
        z-index: -2;
        background: radial-gradient(
          120% 80% at 50% 118%,
          rgba(176, 141, 69, 0.16) 0%,
          rgba(111, 84, 42, 0.06) 30%,
          transparent 68%
        );
        opacity: 1;
      }
      .vignette {
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(
            115% 75% at 50% 42%,
            transparent 30%,
            rgba(2, 2, 2, 0.74) 100%
          ),
          linear-gradient(to bottom, rgba(2, 2, 2, 0.9) 0%, transparent 35%);
      }

      main {
        position: relative;
        max-width: 34rem;
      }

      .code {
        margin: 1.75rem 0 0;
        font-family: "Cormorant Garamond", ui-serif, Georgia, serif;
        font-weight: 300;
        font-size: clamp(4.5rem, 22vw, 9rem);
        line-height: 0.86;
        letter-spacing: -0.02em;
        background: linear-gradient(
          180deg,
          #fbf8f1 0%,
          #efeade 34%,
          #b9b3a6 72%,
          #6d675d 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
      }

      h1 {
        margin: 0.75rem 0 0;
        font-family: "Cormorant Garamond", ui-serif, Georgia, serif;
        font-weight: 700;
        font-size: clamp(1.1rem, 4.2vw, 1.5rem);
        line-height: 1.2;
        letter-spacing: 0.02em;
        color: #f5f2ea;
        text-wrap: balance;
      }

      p {
        margin: 1.25rem auto 0;
        max-width: 26rem;
        color: #b8b3a8;
        text-wrap: pretty;
      }

      .rule {
        display: flex;
        align-items: center;
        gap: 1rem;
        max-width: 20rem;
        margin: 1.75rem auto 0;
      }
      .rule span:first-child,
      .rule span:last-child {
        height: 1px;
        flex: 1;
        background: linear-gradient(90deg, transparent, rgba(176, 141, 69, 0.45));
      }
      .rule span:last-child {
        background: linear-gradient(270deg, transparent, rgba(176, 141, 69, 0.45));
      }
      .rule i {
        width: 7px;
        height: 7px;
        rotate: 45deg;
        border: 1px solid rgba(176, 141, 69, 0.55);
      }

      .back {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        min-height: 2.75rem;
        margin-top: 2.25rem;
        padding: 0.9rem 2rem;
        border: 1px solid rgba(198, 161, 91, 0.9);
        background: #c6a15b;
        color: #020202;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 0.62rem;
        font-weight: 500;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        text-decoration: none;
        overflow: hidden;
        transition:
          color 0.35s ease,
          border-color 0.35s ease;
      }
      .back::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        background: #e1c487;
        transform: scaleY(0);
        transform-origin: 50% 100%;
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .back:hover,
      .back:focus-visible {
        color: #020202;
        border-color: rgba(225, 196, 135, 1);
      }
      .back:hover::before,
      .back:focus-visible::before {
        transform: scaleY(1);
      }
      .back span,
      .back svg {
        position: relative;
        z-index: 1;
      }
      .back svg {
        width: 11px;
        height: 14px;
        transition: transform 0.3s ease;
      }
      .back:hover svg {
        transform: translateY(-2px);
      }

      :focus-visible {
        outline: 1px solid #d4af70;
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        .back,
        .back::before {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="ground"></div>
    <div class="vignette"></div>


    <main>
      <p class="code">404</p>

      <h1>This page does not exist</h1>

      <div class="rule"><span></span><i></i><span></span></div>

      <p>
        The link may be out of date, or the page may have moved.
      </p>

      <a class="back" href="/">
        <span>Back to the homepage</span>
        <svg viewBox="0 0 12 16" aria-hidden="true" fill="none">
          <path
            d="M6 16V3M1 8l5-6 5 6"
            stroke="currentColor"
            stroke-width="1.6"
          />
        </svg>
      </a>
    </main>
  </body>
</html>
