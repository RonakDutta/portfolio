<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07060a" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Page not found, Ronak Dutta</title>

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preload" as="font" type="font/woff2" href="/fonts/mona-sans.woff2" crossorigin />

    <style>
      /* The site's own faces. This page carries no bundle, so it declares the
         two it sets type in. */
      @font-face {
        font-family: "Mona Sans";
        font-style: normal;
        font-weight: 200 900;
        font-stretch: 75% 125%;
        font-display: swap;
        src: url("/fonts/mona-sans.woff2") format("woff2");
      }
      @font-face {
        font-family: "Martian Mono";
        font-style: normal;
        font-weight: 100 800;
        font-stretch: 75% 112.5%;
        font-display: swap;
        src: url("/fonts/martian-mono.woff2") format("woff2");
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        background: #07060a;
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 3rem 1.25rem;
        color: #cdc4b4;
        font-family:
          "Mona Sans",
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        font-size: clamp(1rem, 0.95rem + 0.3vw, 1.12rem);
        line-height: 1.65;
        text-align: center;
        overflow-x: clip;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 36rem;
      }

      /* A lost sun: a still eclipse in CSS. */
      .eclipse {
        position: relative;
        width: min(46vw, 13rem);
        aspect-ratio: 1;
        margin: 0 auto 3.5rem;
      }
      .eclipse::before {
        content: "";
        position: absolute;
        inset: -85%;
        border-radius: 50%;
        background:
          repeating-conic-gradient(from 0deg, rgba(255, 246, 222, 0.22) 0deg 0.7deg, transparent 0.7deg 6deg),
          radial-gradient(
            closest-side,
            rgba(255, 246, 222, 0.95) 34%,
            rgba(236, 215, 163, 0.5) 37%,
            rgba(200, 164, 92, 0.18) 50%,
            rgba(138, 109, 51, 0.06) 70%,
            transparent 100%
          );
        -webkit-mask-image: radial-gradient(closest-side, #000 40%, rgba(0, 0, 0, 0.5) 70%, transparent 100%);
        mask-image: radial-gradient(closest-side, #000 40%, rgba(0, 0, 0, 0.5) 70%, transparent 100%);
        animation: turn 160s linear infinite;
      }
      .eclipse::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: #07060a;
      }
      @keyframes turn {
        to {
          transform: rotate(360deg);
        }
      }

      .label {
        margin: 0;
        font-family: "Martian Mono", ui-monospace, Menlo, monospace;
        font-size: 0.68rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #c8a45c;
      }
      h1 {
        margin: 1.25rem 0 0;
        font-stretch: 125%;
        font-weight: 850;
        font-size: clamp(2rem, 7vw, 3.4rem);
        line-height: 0.95;
        letter-spacing: -0.035em;
        text-transform: uppercase;
        color: #f6f1e7;
        text-wrap: balance;
      }
      p.lede {
        margin: 1.25rem auto 0;
        max-width: 26rem;
        text-wrap: pretty;
      }

      .back {
        position: relative;
        isolation: isolate;
        display: inline-flex;
        align-items: center;
        gap: 1.5rem;
        height: 3.4rem;
        margin-top: 2.5rem;
        padding: 0 0.4rem 0 1.6rem;
        overflow: hidden;
        border-radius: 999px;
        background: linear-gradient(110deg, #a8843f 0%, #d9b974 30%, #f3e2b6 55%, #c8a45c 100%);
        color: #07060a;
        font-weight: 560;
        text-decoration: none;
        box-shadow: 0 14px 44px -14px rgba(200, 164, 92, 0.65);
        transition: color 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .back .disc {
        position: relative;
        display: grid;
        place-items: center;
        width: 2.6rem;
        height: 2.6rem;
      }
      .back .disc::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: 50%;
        background: #07060a;
        transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .back:hover,
      .back:focus-visible {
        color: #ecd7a3;
      }
      .back:hover .disc::before,
      .back:focus-visible .disc::before {
        transform: scale(16);
      }
      .back svg {
        width: 12px;
        height: 12px;
        color: #ecd7a3;
      }

      :focus-visible {
        outline: 1px solid #ecd7a3;
        outline-offset: 4px;
      }

      @media (prefers-reduced-motion: reduce) {
        .eclipse::before {
          animation: none;
        }
        .back,
        .back .disc::before {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eclipse" aria-hidden="true"></div>

      <p class="label">Error 404</p>
      <h1>Lost in totality</h1>
      <p class="lede">This page does not exist. The link may be out of date, or the page may have moved.</p>

      <a class="back" href="/">
        <span>Back to the homepage</span>
        <span class="disc">
          <svg viewBox="0 0 14 14" aria-hidden="true">
            <path
              d="M13 7H1M6 2L1 7l5 5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </a>
    </main>
  </body>
</html>
