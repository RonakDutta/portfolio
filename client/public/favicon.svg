<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Ronak Dutta">
  <title>Ronak Dutta</title>
  <defs>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2333"/>
      <stop offset="0.55" stop-color="#150f1d"/>
      <stop offset="1" stop-color="#2a1410"/>
    </linearGradient>
    <linearGradient id="molten" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="0.3" stop-color="#ffc061"/>
      <stop offset="0.66" stop-color="#ff4d00"/>
      <stop offset="1" stop-color="#8c2606"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb066"/>
      <stop offset="0.5" stop-color="#ff4d00"/>
      <stop offset="1" stop-color="#7a1a06"/>
    </linearGradient>
  </defs>

  <!-- Struck iron body -->
  <path class="sigil-body" d="M32 2.5 61.5 32 32 61.5 2.5 32Z" fill="url(#iron)"/>
  <!-- Ember rim -->
  <path class="sigil-rim" d="M32 2.5 61.5 32 32 61.5 2.5 32Z" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- Light catching the upper-left facet -->
  <path class="sigil-facet" d="M2.5 32 32 2.5" fill="none" stroke="#ffd9a3" stroke-width="1.4" stroke-opacity="0.5"/>
  <!-- Inner rule cut into the face -->
  <path class="sigil-rule" d="M32 10 54 32 32 54 10 32Z" fill="none" stroke="#ff4d00" stroke-width="0.9" stroke-opacity="0.32"/>

